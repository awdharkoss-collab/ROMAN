<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yarım Kalan Akort</title>
<style>
  * { box-sizing: border-box; }
  body { background: #f4efe6; color: #2c2623; font-family: Georgia, serif; padding: 20px; display: flex; justify-content: center; margin: 0; }
  .kitap { max-width: 760px; width: 100%; background: #fcf9f2; padding: 45px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); border-left: 10px solid #7a4938; margin-top: 15px; }
  h1 { text-align: center; color: #7a4938; font-size: 2.3rem; margin-bottom: 5px; }
  .alt { text-align: center; font-style: italic; color: #666; margin-bottom: 25px; }
  .ust-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #e0d6c5; gap: 10px; }
  select { padding: 8px 12px; font-family: Georgia, serif; font-size: 15px; border: 1px solid #cbbba0; border-radius: 5px; background: #fff; color: #2c2623; max-width: 70%; }
  h2 { color: #7a4938; border-bottom: 1px solid #ddd; padding-bottom: 8px; margin-top: 10px; }
  p { line-height: 1.85; font-size: 18px; text-indent: 25px; text-align: justify; margin-bottom: 16px; }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 35px; padding-top: 15px; border-top: 1px solid #ddd; }
  button { background: #7a4938; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  .bilgi { font-size: 14px; color: #777; font-style: italic; }
</style>
</head>
<body>

<div class="kitap">
  <h1>Yarım Kalan Akort</h1>
  <div class="alt">Bir Büyükada Hikâyesi</div>
  
  <div class="ust-bar">
    <select id="bolumSec" onchange="bolumeGit(this.value)"></select>
    <span class="bilgi" id="sayfaBilgi"></span>
  </div>

  <div id="icerik"></div>

  <div class="nav">
    <button id="geri" onclick="degistir(-1)">← Önceki Sayfa</button>
    <span id="sayac"></span>
    <button id="ileri" onclick="degistir(1)">Sonraki Sayfa →</button>
  </div>
</div>

<script>
const ROMAN_BOLUMLERI = [
  {
    baslik: "Bölüm 1: Yağmurun Getirdiği Yabancı",
    metin: `
      <p>Kasım ayı Büyükada’ya bir misafir gibi değil, evin eski ve huysuz sahibi gibi çökmüştü. İskeleden yukarı kıvrılan Arnavut kaldırımlı sokaklar, sabahın erken saatlerinden beri yağan ince ama inatçı yağmurla koyu bir kurşun rengine bürünmüştü. Deniz kokusuna karışan ıslak çam ve yanmış odun kokusu, adanın yazlık neşesini çoktan kovmuş, geriye yalnızca rüzgârın ahşap panjurlara vuran uğultusunu ve martıların kesik çığlıklarını bırakmıştı.</p>
      <p>Defne, sahaf dükkânının buğulanmış vitrin camının ardında, ceviz ağacından yapılma eski tezgâhın üzerine eğilmişti. Önünde sırtı dağılmış, sayfaları yılların neminden dalgalanmış on dokuzuncu yüzyıldan kalma bir şiir kitabı duruyordu. Sağ eliyle ince uçlu samur fırçayı tutkal kabına daldırırken, sol elini her zamanki gibi üzerine geçirdiği kalın yün kazağın uzun yeninin içine saklamıştı. Parmaklarının ucundaki o tanıdık uyuşukluk, hava soğuduğunda daha da belirginleşiyor, ona bir daha asla basamayacağı notaların ağırlığını hatırlatıyordu.</p>
      <p>Bir zamanlar konservatuvarın en parlak viyolonsel öğrencilerinden biriydi Defne. Sahneye çıktığında gözlerini kapatır, yay tellere değdiği an dünyayla arasındaki bütün mesafeyi eritirdi. Ta ki üç yıl önce, yağmurlu bir Ekim akşamında geçirdiği o trafik kazasına kadar. Aracın sol kapısından aldığı darbe, sol omzundan parmak uçlarına kadar uzanan sinir ağlarını geri dönülmez biçimde zedelemişti. Doktorlar "mucize" demişti hayatta kalmasına; ama Defne için hayatta kalmak, sesi elinden alınmış bir şarkıcı gibi yaşamaya devam etmekten ibaretti.</p>
      <p>Dükkânın kapısındaki pirinç çıngırak, rüzgârla karışık tok bir sesle çaldı. İçeriye soğuk havayla birlikte uzun boylu, omuzları yağmurdan koyulaşmış kaşe kabanlı bir adam girdi. Elindeki ıslak şemsiyeyi kapının yanındaki bakır kovaya bırakırken etrafına bakındı. Yüz hatları keskin ama yorgundu; gözlerinin altında uykusuz gecelerin bıraktığı o derin, morumsu gölge duruyordu.</p>
      <p>Defne başını kitabın üzerinden kaldırmadan, "Hoş geldiniz," dedi. Sesi, dükkânın içindeki eski duvar saatlerinin tik taklarına karışan alçak, dingin bir tınıdaydı. "Sadece yağmurdan kaçmak için girdiyseniz bile sobanın yanına geçebilirsiniz. Çayımız yeni demlendi."</p>
      <p>Kerem ıslak saçlarını elinin tersiyle geriye iterken duraksadı. Beklediği şey sıradan bir esnaf nezaketi değildi; karşısındaki kadının sesinde, kendi içindeki sessizliğe benzeyen bir tür kabulleniş vardı. Rafların arasındaki dar koridordan geçip döküm sobanın yanındaki hasır tabureye ilişti. Ellerini sobanın sıcaklığına uzatırken gözleri tezgâha kaydı.</p>
      <p>Kadının sağ eli bir cerrah titizliğiyle eski kâğıtları onarırken, sol eli masanın kenarında, kıpırtısız bir gölge gibi duruyordu. Kerem, mesleği gereği insanlardan çok yapılardaki kırıkları, çatlakları ve gizlenen kusurları fark etmeye alışıktı. O an, karşısındaki kadının da tıpkı restore etmek için adaya geldiği o eski ahşap köşk gibi, dışarıdan ayakta duran ama içten içe sessizce onarılmayı bekleyen bir yanı olduğunu sezdi.</p>
      <p>"Bazen insan sadece sığınacak bir sessizlik arıyor," dedi Kerem, bakışlarını sobanın içindeki korlardan ayırmadan. "İstanbul’un gürültüsü insanın kendi sesini bile duymasına izin vermiyor."</p>
      <p>Defne fırçayı tutkal kabının kenarına bıraktı, ilk kez başını kaldırıp adama baktı. Ela gözlerinde ne merak ne de yargı vardı; yalnızca yağmurlu bir ikindinin durgunluğu... "O zaman doğru adaya gelmişsiniz. Kışın burada rüzgârdan ve martılardan başka kimse konuşmaz. Yalnızlığa alışık değilseniz zorlanırsınız."</p>
      <p>Kerem hafifçe gülümsedi ama bu gülümseme gözlerine ulaşmadı. "Yalnızlık benim uzun zamandır en sadık ev arkadaşım."</p>
      <p>Arka odadan gelen ağır ayak sesleri sessizliği böldü. Salih Usta, elinde iki ince belli çay bardağı ve yakasında küçük bir büyüteçle içeri girdi. Yılların saat tamirciliği omuzlarını hafifçe öne eğmiş, ama bakışlarındaki keskinliği hiç azaltmamıştı. Kerem’i görünce çatık kaşlarının altındaki gözleri yumuşadı.</p>
      <p>"Evlat, sırılsıklam olmuşsun," dedi Salih Usta, bardaklardan birini Kerem’in yanındaki küçük sehpaya bırakırken. "Yabancısın buralara. Yazlıkçılar çoktan döndü, bu mevsimde adaya ya kaçanlar gelir ya da bir şey arayanlar. Sen hangisisin?"</p>
      <p>Kerem sıcak bardağın etrafına parmaklarını doladı. Yıllar sonra ilk kez avuçlarının içine yayılan bu basit sıcaklığın kalbine dokunduğunu hissetti. "Belki ikisi de," dedi alçak bir sesle. "Ben mimarım. Yukarıda, Çankaya sırtlarındaki eski Hacıyan Köşkü’nün restorasyonu için geldim. Kış boyu buradayım."</p>
      <p>Tezgâhın arkasında bir anlık mutlak bir sessizlik oldu. Defne’nin sağ elindeki keten bez havada asılı kaldı. Sol elinin parmakları, kazağının yününün içinde istemsizce kasıldı. Çankaya sırtlarındaki o köşk... Çocukluğunda bahçe duvarının dibine oturup içeriden yükselen piyano ve viyolonsel seslerini dinlediği, müziğe âşık olduğu o unutulmuş konak.</p>
      <p>Kerem, kadının yüzünden geçen o ani gölgeyi fark etti ama sormadı. Bazı hikâyelerin anlatılmak için zamana, bazı yaraların ise dokunulmadan önce yalnızca anlaşılmaya ihtiyacı olduğunu biliyordu. Dışarıda yağmur hızlanırken, dükkândaki eski saatlerden biri tok bir sesle beşi vurdu; sanki ikisinin de durmuş olan zamanı o an yeniden işlemeye başlamıştı.</p>
    `
  },
  {
    baslik: "Bölüm 2: Çatlak Duvarlar",
    metin: `
      <p>Ertesi sabah yağmur dinmiş, yerini Büyükada’nın tepelerini pamuk gibi saran yoğun bir sise bırakmıştı. Kerem, sabahın ilk ışıklarıyla birlikte Çankaya sırtlarındaki Hacıyan Köşkü’nün demir bahçe kapısının önündeydi. Paslanmış menteşeler itildiğinde çıkan o uzun gıcırtı, sanki yıllardır uyuyan bir devi uyandırmış gibiydi.</p>
      <p>Üç katlı ahşap köşk, zamanın ve rutubetin insafına terk edilmiş yaşlı bir gemiyi andırıyordu. Bahçedeki asırlık manolya ağaçlarının dalları kırık pencerelerden içeri uzanmış, sarmaşıklar beyaz boyası dökülmüş cepheyi bir ağ gibi sarmıştı. Kerem, elindeki deri kaplı çizim defterini ve şerit metreyi çıkarıp verandalı girişe doğru yürüdü. Burası onun sadece iş sahası değil, kendi dağılmış zihnini toparlamak için tutunduğu son daldı.</p>
      <p>İçeri adım attığında burnuna küf, ıslak ahşap ve eski kâğıt kokusu doldu. Salonun ortasında durup yüksek tavanlardaki alçı kabartmalara baktı. Bir zamanlar burada kahkahaların, kadeh seslerinin ve müziğin yankılandığını hayal etmek zor değildi. Ama şimdi her köşede derin çatlaklar, çökmüş döşemeler ve sessizlik vardı. Tıpkı kendi evliliği gibi... Aylarca süren sessiz bekleyişlerin, hastane koridorlarının ve kaybedilen o küçücük kalp atışının ardından karısıyla aralarında büyüyen o onarılmaz çatlaklar gibi.</p>
      <p>Üst kata çıkan geniş ahşap merdivenleri gıcırtılar eşliğinde tırmandı. İkinci kattaki büyük odanın kapısını açtığında duraksadı. Burası köşkün eski kütüphanesi ve müzik odasıydı. Duvar boyunca uzanan ceviz kitaplıkların rafları nemden eğilmiş, yüzlerce ciltli kitap ve nota defteri yerlere saçılmıştı. Odanın köşesinde ise üzeri tozlu beyaz bir örtüyle kapatılmış büyük bir nesne duruyordu.</p>
      <p>Kerem örtüyü yavaşça çektiğinde altından kuyruklu, maun ağacından yapılma eski bir piyano çıktı. Tuşlarının fildişi kaplamaları sararmış, kapağı çatlamıştı. Tam o sırada odanın kapısında hafif bir ayak sesi duyuldu.</p>
      <p>"O piyano en son on beş yıl önce çalındı," dedi tanıdık, dingin bir ses.</p>
      <p>Kerem arkasına döndüğünde kapı eşiğinde Defne’yi gördü. Üzerinde koyu yeşil bir yağmurluk, elinde ise Salih Usta’nın gönderdiği sıcak termos vardı. Sabah sisi saçlarının uçlarını nemlendirmişti.</p>
